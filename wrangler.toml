name = "tc002-pixel-clock"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Fires every 10 minutes from 07:00 to 23:59 at UTC+0800.
# Cloudflare cron is always UTC, hence 23:00-15:59 UTC below.
# Each wake checks the agenda calendars: a newly active
# event triggers an image (same event is never re-sent); with no active event a
# random-topic image is sent, throttled to at most once per hour (see src/pipeline.ts).
[triggers]
crons = ["*/10 23,0-15 * * *"]

# The KV namespace is auto-provisioned on first deploy (binding without an id):
# Wrangler creates "tc002-pixel-clock-kv" and binds it; later deploys inherit the
# binding from the currently deployed version, so the same namespace is reused.
[[kv_namespaces]]
binding = "KV"

# Variables and secrets are intentionally NOT declared in this repo.
# Deployment is automated via the Cloudflare GitHub App (Workers Builds);
# set them in the dashboard (Settings -> Variables and Secrets):
#
#   Secrets: OPENAI_API_KEY, TC002_TOKEN, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ALLOWED_EMAIL
#
# (The TC002 base URL is configured in the Web UI and stored in KV.)
